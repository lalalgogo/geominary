  document.body.style.background = theme.bodyBg;
  document.documentElement.style.background = theme.bodyBg;
  document.querySelectorAll('.theme-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.id === theme.id);
  });
  const rings = document.querySelectorAll('.ring');
  if (theme.gentle) {
    rings[0].style.animationDuration = '60s';
    rings[1].style.animationDuration = '45s';
    rings[2].style.animationDuration = '30s';
  } else {
    rings[0].style.animationDuration = '20s';
    rings[1].style.animationDuration = '14s';
    rings[2].style.animationDuration = '8s';
  }
}

});

function sampleBinary() {
  const t = total + 1;
  let n = 1;
  while ((t & (1 << (n-1))) === 0) n++;
  return n;
}

function sample(offset = 0) {
  const u = Math.random(); let cum = 0;
  for (let n = 1; n <= 51; n++) { cum += Math.pow(2,-n); if (u < cum) return offset + n; }
  return sample(offset + 51);
}

function toRoman(n) {
  const vals = [1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const syms = ['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let result = '';
  for (let i = 0; i < vals.length; i++) {
    while (n >= vals[i]) { result += syms[i]; n -= vals[i]; }
  }
  return result;
}

class Sparkle {
  constructor(x, y, size, color) {
    this.x = x; this.y = y;
    this.size = size; this.color = color;
    this.life = 1; this.maxSize = size;
    this.phase = 0; // 0:拡大 1:縮小
  }
  update() {
    this.life -= 0.04;
    if (this.life <= 0) this.dead = true;
    return !this.dead;
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.globalAlpha = Math.min(this.life * 2, 1);
    const s = this.maxSize * (1 - Math.pow(1 - this.life, 2));
    ctx.fillStyle = this.color;
    ctx.strokeStyle = this.color;
    // 4点の✨形
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const r = i % 2 === 0 ? s : s * 0.2;
      if (i === 0) ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
      else ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

class Particle {
  constructor(x,y,opts={}){
    this.x=x;this.y=y;this.vx=opts.vx??(Math.random()-0.5)*6;this.vy=opts.vy??(Math.random()-0.5)*6-2;
    this.size=opts.size??(Math.random()*4+2);this.color=opts.color??'#fff';this.alpha=1;
    this.decay=opts.decay??(Math.random()*0.02+0.015);this.shape=opts.shape??'circle';
    this.gravity=opts.gravity??0.12;this.rotation=Math.random()*Math.PI*2;this.rotSpeed=(Math.random()-0.5)*0.2;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.gravity;this.alpha-=this.decay;this.rotation+=this.rotSpeed;}
  draw(ctx){
    if(this.alpha<=0)return;
    ctx.save();ctx.globalAlpha=this.alpha;ctx.translate(this.x,this.y);ctx.rotate(this.rotation);
    if(this.shape==='star'){drawStar(ctx,0,0,this.size,this.color);}
    else if(this.shape==='spark'){ctx.strokeStyle=this.color;ctx.lineWidth=this.size*0.4;ctx.beginPath();ctx.moveTo(-this.size,0);ctx.lineTo(this.size,0);ctx.stroke();}
    else{ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(0,0,this.size,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }
  get dead(){return this.alpha<=0;}
}
class RingBurst {
  constructor(x,y,color,maxR){this.x=x;this.y=y;this.color=color;this.r=0;this.maxR=maxR;this.alpha=1;}
  update(){this.r+=(this.maxR-this.r)*0.1+2;this.alpha-=0.03;}
  draw(ctx){if(this.alpha<=0)return;ctx.save();ctx.globalAlpha=this.alpha;ctx.strokeStyle=this.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.stroke();ctx.restore();}
  get dead(){return this.alpha<=0;}
}
function drawStar(ctx,x,y,r,color){
  ctx.fillStyle=color;ctx.beginPath();
  for(let i=0;i<5;i++){const a=(i*4*Math.PI)/5-Math.PI/2;const ir=r*0.4;if(i===0)ctx.moveTo(x+r*Math.cos(a),y+r*Math.sin(a));else ctx.lineTo(x+r*Math.cos(a),y+r*Math.sin(a));const ia=a+(2*Math.PI)/10;ctx.lineTo(x+ir*Math.cos(ia),y+ir*Math.sin(ia));}
  ctx.closePath();ctx.fill();
}

function accumulate() {
  const n = gameMode === 'binary' ? sampleBinary() : sample();
  counts[n]=(counts[n]||0)+1; total++; if(n>maxSeen){ maxSeen=n; }
  if(n===curStreakNum){curStreakCount++;}else{curStreakNum=n;curStreakCount=1;}
  if(curStreakCount>bestStreakCount){bestStreakCount=curStreakCount;bestStreakNum=curStreakNum;}
  if(curStreakCount>(streakBest[n]||0))streakBest[n]=curStreakCount;
  addPoints(n);
  numHistory.push(n);
  if(numHistory.length > MAX_HISTORY) {
    // historyBaseは「numHistory[0]を処理する前の状態」でないといけない
    // → shiftする前に現在のhistoryBaseをそのまま残し、
    //   dropping(=numHistory[0])を処理した結果を次のhistoryBaseとして計算
    const dropping = numHistory[0];
    const nextBase = Object.assign({}, historyBaseStreakBest);
    let nextCurNum = historyBaseCurNum;
    let nextCurCount = historyBaseCurCount;
    if (dropping === nextCurNum) {
      nextCurCount++;
    } else {
      nextCurNum = dropping;
      nextCurCount = 1;
    }
    if (nextCurCount > (nextBase[dropping]||0)) {
      nextBase[dropping] = nextCurCount;
    }
    numHistory.shift();
    // shiftした後に次のhistoryBaseをセット
    historyBaseStreakBest = nextBase;
    historyBaseCurNum = nextCurNum;
    historyBaseCurCount = nextCurCount;
  }
  lastSeen[n] = total;
  if (!recentPositions[n]) recentPositions[n] = [];
  const rp = recentPositions[n];
  if (rp.length === 0 || total > rp[rp.length - 1]) {
    rp.push(total);
    if (rp.length > 101) rp.shift();
  }
  if (total % 10 === 0) saveState();
  return n;
}

function addBulk(count, chunkSize) {
  // addBulk中はintervalを一時停止
  const wasRunning = intervalId !== null;
  if (intervalId) { clearInterval(intervalId); intervalId = null; }
  let remaining = count;
  function step() {
    const n = Math.min(chunkSize, remaining);
    for (let i = 0; i < n; i++) accumulate();
    remaining -= n;
    if (remaining <= 0) {
      const last = numHistory.length > 0 ? numHistory[numHistory.length-1] : 1;
      updateDisplay(last);
      // 再開
      if (wasRunning && !isPaused) intervalId = setInterval(tick, 1000);
    } else { requestAnimationFrame(step); }
  }
  requestAnimationFrame(step);
}

const SAVE_KEY = 'geominary_save';

// ── 暗号化・チェックサム ──
const CIPHER_KEY = 'gm26lgg';

function calcChecksum(str) {
  let h = 0x12345678;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 0x9e3779b9);
    h ^= h >>> 16;
  }
  return (h >>> 0).toString(16).padStart(8, '0');
}

function encodeData(data) {
  const json = JSON.stringify(data);
  const cs = calcChecksum(json);
  const payload = cs + ':' + json;
  // XOR + Base64
  const key = CIPHER_KEY;
  let xored = '';
  for (let i = 0; i < payload.length; i++) {
    xored += String.fromCharCode(payload.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  }
  return btoa(unescape(encodeURIComponent(xored)));
}

function decodeData(encoded) {
  try {
    const xored = decodeURIComponent(escape(atob(encoded)));
    const key = CIPHER_KEY;
    let payload = '';
    for (let i = 0; i < xored.length; i++) {
      payload += String.fromCharCode(xored.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    }
    const sep = payload.indexOf(':');
    if (sep < 0) return null;
    const cs = payload.slice(0, sep);
    const json = payload.slice(sep + 1);
    if (calcChecksum(json) !== cs) return null; // チェックサム不一致
    return JSON.parse(json);
  } catch(e) { return null; }
}

function saveState() {
  try {
    const data = {
      counts, total, maxSeen, streakBest,
      curStreakNum, curStreakCount, bestStreakNum, bestStreakCount, lastSeen,
      recentPositions,
      numHistory, historyBaseStreakBest, historyBaseCurNum, historyBaseCurCount,
      themeId: currentTheme.id, langKey: currentLangKey, scaleMode, gameMode,
    };
    localStorage.setItem(SAVE_KEY, encodeData(data));
  } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    // 旧形式（平文JSON）との互換性
    let data;
    try {
      data = decodeData(raw);
      if (!data) {
        // 旧形式を試みる
        data = JSON.parse(raw);
      }
    } catch(e) { return false; }
    if (!data) return false;
    Object.assign(counts, data.counts || {});
    total = data.total || 0;
    maxSeen = data.maxSeen || 0;
    Object.assign(streakBest, data.streakBest || {});
    curStreakNum = data.curStreakNum || null;
    curStreakCount = data.curStreakCount || 0;
    bestStreakNum = data.bestStreakNum || null;
    bestStreakCount = data.bestStreakCount || 0;
    Object.assign(lastSeen, data.lastSeen || {});
    Object.keys(recentPositions).forEach(k => delete recentPositions[k]);
    Object.assign(recentPositions, data.recentPositions || {});
    if (data.numHistory) {
      numHistory.length = 0;
      // 旧形式（{n,...}）との互換性、かつ数値のみ保持
      data.numHistory.forEach(e => {
        const val = typeof e === 'object' ? e.n : e;
        if (typeof val === 'number' && val > 0) numHistory.push(val);
      });
    }
    historyBaseStreakBest = data.historyBaseStreakBest || {};
    historyBaseCurNum = data.historyBaseCurNum || null;
    historyBaseCurCount = data.historyBaseCurCount || 0;
    if (data.themeId) { const theme = THEMES.find(t => t.id === data.themeId); if (theme) applyTheme(theme); }
    if (data.langKey) { applyLang(LANGS[data.langKey], data.langKey); }
    if (data.scaleMode) {
      scaleMode = data.scaleMode;
      document.querySelectorAll('.scale-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.scale === scaleMode));
    }
    gameMode = data.gameMode || 'random';
    return true;
  } catch(e) { return false; }
}

function calcStatsAt(idx) {
  const localCounts = {}, sb = {};
  let tot = 0, mx = 0;
  let csn = null, csc = 0, bsn = null, bsc = 0;
  if (gameMode === 'binary') {
    const offset = Math.max(0, total - numHistory.length);
    for (let i = 0; i <= idx; i++) {
      const t = offset + i + 1;
      let n = 1;
      while ((t & (1 << (n-1))) === 0) n++;
      localCounts[n] = (localCounts[n]||0) + 1;
      tot++;
      if (n > mx) mx = n;
    }
    return { counts: localCounts, total: tot, maxSeen: mx, streakBest: sb, curStreakNum: null, curStreakCount: 0, bestStreakNum: null, bestStreakCount: 0 };
  }
  Object.keys(counts).forEach(k => { localCounts[k] = counts[k]; });
  tot = total; mx = maxSeen;
  for (let i = idx + 1; i < numHistory.length; i++) {
    const n = numHistory[i];
    if (localCounts[n]) { localCounts[n]--; if (localCounts[n] === 0) delete localCounts[n]; }
    tot--;
  }
  mx = Object.keys(localCounts).reduce((a, k) => Math.max(a, Number(k)), 0);
  Object.assign(sb, historyBaseStreakBest);
  csn = historyBaseCurNum; csc = historyBaseCurCount;
  for (let i = 0; i <= idx; i++) {
    const n = numHistory[i];
    if (n === csn) { csc++; } else { csn = n; csc = 1; }
    if (csc > (sb[n]||0)) sb[n] = csc;
    if (csc > bsc) { bsc = csc; bsn = csn; }
  }
  return { counts: localCounts, total: tot, maxSeen: mx, streakBest: sb, curStreakNum: csn, curStreakCount: csc, bestStreakNum: bsn, bestStreakCount: bsc };
}

function renderBarsFromStats(stats) {
  const el = document.getElementById('bars');
  const countValues = Object.values(stats.counts);
  const maxC = countValues.length > 0 ? Math.max(...countValues, 1) : 1;
  const displayMax = (stats.maxSeen || 0) + 2;
  if (displayMax <= 2) { el.innerHTML = ''; return; }
  el.innerHTML = '';
  for (let n = 1; n <= displayMax; n++) {
    const cv = stats.counts[n]||0;
    let pct, label;
    if (scaleMode === 'log2c') {
      const v = cv > 0 ? Math.log2(cv) : 0;
      const maxV = Math.log2(Math.max(maxC, 1));
      pct = maxV > 0 ? (v / maxV * 100).toFixed(1) : 0;
      label = cv > 0 ? v.toFixed(2) : 0;
    } else if (scaleMode === 'norm') {
      const ratio = (stats.total > 0 && cv > 0) ? cv / stats.total : 0;
      const nv = ratio > 0 ? Math.log2(ratio) / (-n) : null;
      pct = nv !== null ? Math.min(Math.max(nv * 50, 0), 100).toFixed(1) : 0;
      label = nv !== null ? nv.toFixed(3) : '—';
    } else {
      pct = maxC > 0 ? (cv / maxC * 100).toFixed(1) : 0;
      label = cv;
    }
    const normOver2 = (scaleMode === 'norm' && label !== '—' && parseFloat(label) > 1.0)
      ? `<div class="bar-fill-over" style="left:50%;width:${Math.min((parseFloat(label)-1.0)*50,50).toFixed(1)}%"></div>`
      : '';
    const baseline2 = scaleMode === 'norm'
      ? `<div class="bar-baseline" style="left:50%"></div>` : '';
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `
      <div class="bar-label">${n}</div>
      <div class="bar-track">${baseline2}<div class="bar-fill" style="width:${pct}%"></div>${normOver2}</div>
      <div class="bar-count">${label}</div>`;
    row.addEventListener('touchstart', e => {
      e.stopPropagation();
      if (isPaused) {
        const t = e.touches[0];
        touchStartX = t.clientX; touchStartY = t.clientY;
        clearTimeout(probHoldTimer);
        probPendingN = null;
        let moved = false;
        const moveHandler = (ev) => {
          const mt = ev.touches[0];
          if (Math.abs(mt.clientX - touchStartX) > 12 || Math.abs(mt.clientY - touchStartY) > 12) moved = true;
        };
        document.addEventListener('touchmove', moveHandler, { passive: true, once: true });
        probHoldTimer = setTimeout(() => {
          if (!moved) {
            // 0回の数字はメイン数字更新・演出なし、直近データのみ
            // 0回以外はメイン数字更新・演出あり
            if ((counts[n] || 0) > 0) {
              const el = document.getElementById('bigNumber');
              const kanjiText = currentTheme.roman ? toRoman(n) : currentTheme.kanji ? toKanji(n) : n;
              el.style.transition = '';
              el.style.opacity = '1';
              el.classList.remove('flash'); void el.offsetWidth;
              el.textContent = kanjiText;
              el.style.marginTop = currentTheme.id === 'kawaii' ? '-30px' : '';
              el.classList.add('flash');
              document.getElementById('probLabel').textContent = `P = ${frac(n)}`;
              triggerEffect(n);
            }
            // 0回でも直近データパネルは表示
            showHistoryChart(n);
          }
        }, 200);
      } else {
        onBarTouchStart(n, e);
      }
    }, { passive: true });
    if (cv === 0) {
      row.style.opacity = '0.3';
    }
    el.appendChild(row);
  }
}

let pointsEffectTimer = null;

function calcIntervalRarity(n, interval) {
  const p = Math.pow(2, -n);
  const rarityLate = interval * (-Math.log10(1 - p));
  const cdf = 1 - Math.pow(1 - p, interval);
  const rarityEarly = cdf > 0 ? -Math.log10(cdf) : 0;
  return (Math.max(rarityLate, rarityEarly) - Math.log10(2)) * 2;
}

function calcStreakRarity(n, streak) {
  // n回連続streak回の確率 = (1/2^n)^streak
  // レア度 = ((streak*n - 1) * 2 * log10(2))
  return (streak * n - 1) * 2 * Math.log10(2);
}

function showPointsEffect(pts, r, label) {
  if (!pointsEffectEnabled) return;
  const el = document.getElementById('pointsEffect');
  if (!el) return;
  clearTimeout(pointsEffectTimer);
  el.style.animation = 'none';
  void el.offsetWidth;

  const size = Math.abs(r) >= 10 ? 32 : Math.abs(r) >= 9 ? 26 : Math.abs(r) >= 8 ? 22 : 18;
  const color = Math.abs(r) >= 10 ? '#ffd700' : Math.abs(r) >= 9 ? '#ff8c00' : Math.abs(r) >= 8 ? 'var(--accent)' : 'var(--fg)';
  el.style.fontSize = `${size}px`;
  el.style.color = color;
  const text = label ? `${label} +${pts.toLocaleString()}pt` : `+${pts.toLocaleString()} pt`;
  el.textContent = text;
  requestAnimationFrame(() => {
    el.style.animation = 'pointsEffectAnim 1.8s ease-out forwards';
    pointsEffectTimer = setTimeout(() => { el.style.animation = 'none'; }, 1900);
  });

  // レア度に応じたキラキラ演出
  const ar = Math.abs(r); // 絶対値で判定
  const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#00ffcc';
  const sparkCount = ar >= 10 ? 12 : ar >= 9 ? 8 : ar >= 8 ? 5 : 3;
  const sparkSize = ar >= 10 ? 28 : ar >= 9 ? 20 : ar >= 8 ? 14 : 9;
  const colors = ar >= 10 ? ['#ffd700','#fff','#ffaa00'] : ar >= 9 ? ['#ff8c00','#fff','#ffcc00'] : [accentColor, '#fff'];
  for (let i = 0; i < sparkCount; i++) {
    const ox = (Math.random()-0.5) * (ar >= 10 ? 180 : ar >= 9 ? 140 : ar >= 8 ? 100 : 60);
    const oy = (Math.random()-0.5) * (ar >= 10 ? 180 : ar >= 9 ? 140 : ar >= 8 ? 100 : 60);
    const size = sparkSize * (0.5 + Math.random() * 0.8);
    const color = colors[i % colors.length];
    setTimeout(() => effects.push(new Sparkle(cx()+ox, cy()+oy, size, color)), i * (ar >= 10 ? 60 : 80));
  }
  if (ar >= 10) flashScreen(accentColor, 0.2, 80);
}

function recordAndAddPoints(n, interval, pts, r, label, skipEffect) {
  let sign = '+';
  if (interval !== null) {
    const p = Math.pow(2, -n);
    const rarityLate = interval * (-Math.log10(1 - p));
    const cdf = 1 - Math.pow(1 - p, interval);
    const rarityEarly = cdf > 0 ? -Math.log10(cdf) : 0;
    sign = rarityLate >= rarityEarly ? '-' : '+';
  }
  points += pts;
  document.getElementById('pointsDisplay').textContent = points.toLocaleString();
  if (!skipEffect) showPointsEffect(pts, r, label);
  pointsHistory.push({
    n, interval, pts,
    rarity: `${sign}${r.toFixed(2)}`,
    label: label || null,
    total,
    date: new Date().toLocaleString('ja-JP', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }),
  });
  if (pointsHistory.length > 100) pointsHistory.shift();
  savePoints();
}

function addPoints(n) {
  const prev = lastSeen[n];
  const interval = prev !== undefined ? total - prev : total;
  if (interval <= 0) return;

  let bestR = 0, bestPts = 0, bestLabel = null, bestInterval = null;

  // 間隔に対するポイント
  const r = calcIntervalRarity(n, interval);
  if (r >= 7 && r > bestR) {
    bestR = r; bestPts = Math.floor(Math.pow(4, r - 7));
    bestLabel = `${interval.toLocaleString()}${currentLang.pointsAgo || '回ぶり！'}`;
    bestInterval = interval;
  }

  // 数字自体の確率に対するポイント
  const rb = calcIntervalRarity(n, 1);
  if (rb >= 7 && rb > bestR) {
    bestR = rb; bestPts = Math.floor(Math.pow(4, rb - 7));
    bestLabel = `P=1/${Math.pow(2,n).toLocaleString()}`;
    bestInterval = 1;
  }

  // 連続ボーナス
  if (curStreakNum === n && curStreakCount >= 2) {
    const rs = calcStreakRarity(n, curStreakCount);
    if (rs >= 7 && rs > bestR) {
      bestR = rs; bestPts = Math.floor(Math.pow(4, rs - 7));
      bestLabel = `${curStreakCount}${currentLang.pointsStreak || '連続！'}`;
      bestInterval = null;
    }
  }

  // 全種類加算
  let totalPts = 0;
  const r2 = calcIntervalRarity(n, interval);
  const agoLabel = `${interval.toLocaleString()}${currentLang.pointsAgo || '回ぶり！'}`;
  if (r2 >= 7) { const pts2 = Math.floor(Math.pow(4, r2 - 7)); totalPts += pts2; recordAndAddPoints(n, interval, pts2, r2, agoLabel, true); }
  const rb2 = calcIntervalRarity(n, 1);
  if (rb2 >= 7) { const ptsB2 = Math.floor(Math.pow(4, rb2 - 7)); totalPts += ptsB2; recordAndAddPoints(n, 1, ptsB2, rb2, `P=1/${Math.pow(2,n).toLocaleString()}`, true); }
  if (curStreakNum === n && curStreakCount >= 2) {
    const rs2 = calcStreakRarity(n, curStreakCount);
    const streakLabel = `${curStreakCount}${currentLang.pointsStreak || '連続！'}`;
    if (rs2 >= 7) { const ptsS2 = Math.floor(Math.pow(4, rs2 - 7)); totalPts += ptsS2; recordAndAddPoints(n, null, ptsS2, rs2, streakLabel, true); }
  }
  if (bestR >= 7) showPointsEffect(bestPts, bestR, bestLabel);
}

      document.addEventListener('touchmove', moveHandler, { passive: true });
      holdTimer = setTimeout(() => {
        document.removeEventListener('touchmove', moveHandler);
        if (moved) return;
        updateDisplay(rec.n);
        const el = document.getElementById('bigNumber');
        el.classList.remove('flash'); void el.offsetWidth;
        el.classList.add('flash');
        document.getElementById('probLabel').textContent = `P = ${frac(rec.n)}`;
        triggerEffect(rec.n);
        showPointsEffect(rec.pts, parseFloat(rec.rarity), rec.label);
      }, 200);
    }, { passive: true });
    list.appendChild(item);
  });
}

function showHistoryChart(n) {
  const positions = recentPositions[n] || [];
  const panel = document.getElementById('historyPanel');
  const title = document.getElementById('historyPanelTitle');
  const barsEl = document.getElementById('historyBars');
  const sub = document.getElementById('historyPanelSub');

  title.textContent = `${n} ${currentLang.historyTitle ?? 'の出現間隔（直近'}${positions.length > 0 ? Math.min(positions.length, 100) : 0}${currentLang.historyTitleSuffix ?? '回）'}　P = ${frac(n)}`;
  barsEl.innerHTML = '';

  let recentGaps = [];
  if (positions.length >= 1) {
    const gaps = [positions[0]];
    for (let i = 1; i < positions.length; i++) {
      gaps.push(positions[i] - positions[i-1]);
    }
    recentGaps = gaps.slice(-100);
    const maxGap = Math.max(...recentGaps, 1);
    const minGap = Math.min(...recentGaps);
    const maxIdx = recentGaps.lastIndexOf(maxGap);
    const minIdx = recentGaps.indexOf(minGap);

    recentGaps.forEach((gap, i) => {
      const pct = Math.max((gap / maxGap) * 40, 2);
      const wrap = document.createElement('div');
      wrap.className = 'h-bar-wrap';
      const bar = document.createElement('div');
      bar.className = 'h-bar';
      bar.style.height = `${pct}px`;
      if (i === maxIdx) {
        bar.style.background = 'var(--fg)';
        bar.style.opacity = '1';
      } else if (i === minIdx) {
        bar.style.background = 'var(--accent)';
        bar.style.opacity = '0.45';
      } else {
        const brightness = 0.4 + (i / recentGaps.length) * 0.6;
        bar.style.opacity = brightness.toFixed(2);
      }
      const lbl = document.createElement('div');
      lbl.className = 'h-bar-label';
      lbl.textContent = gap;
      wrap.appendChild(bar);
      wrap.appendChild(lbl);
      barsEl.appendChild(wrap);
    });
    barsEl.scrollLeft = barsEl.scrollWidth;
  }

  const avgRecent = recentGaps.length > 0
    ? (recentGaps.reduce((a,b)=>a+b,0)/recentGaps.length).toFixed(1)
    : '—';
  const avgTotal = (counts[n] && counts[n] > 0)
    ? (total / counts[n]).toFixed(1)
    : '—';
  const totalCount = counts[n] || 0;
  const expectedVal = total * Math.pow(2, -n);
  const expected = expectedVal.toFixed(expectedVal < 1 ? 3 : 1);
  const p = Math.pow(2, -n);

  function erf(x) {
    const t = 1 / (1 + 0.3275911 * Math.abs(x));
    const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
    return x >= 0 ? y : -y;
  }

  let stddevStr, zStr, probStr, distLabel;
  distLabel = currentLang.historyZscore ?? 'Z値:';

  if (expectedVal >= 5) {
    // 正規近似
    const stddev = Math.sqrt(total * p * (1 - p));
    const z = (totalCount - expectedVal) / stddev;
    stddevStr = stddev.toFixed(1);
    zStr = z.toFixed(2);
    const probBeyond = (1 - erf(Math.abs(z) / Math.sqrt(2))) * 100;
    probStr = probBeyond.toFixed(probBeyond < 0.1 ? 3 : 1) + '%';
    distLabel = currentLang.historyZscore ?? 'Z値:';
  } else {
    // ポアソン近似
    const lambda = expectedVal;
    // P(X <= k)を計算
    let poissonCDF = 0;
    let logLambda = lambda > 0 ? Math.log(lambda) : 0;
    let logFactorial = 0;
    let pmfK = 0;
    for (let i = 0; i <= totalCount; i++) {
      if (i > 0) logFactorial += Math.log(i);
      const pmf = lambda > 0 ? Math.exp(-lambda + i * logLambda - logFactorial) : (i === 0 ? 1 : 0);
      poissonCDF += pmf;
      if (i === totalCount) pmfK = pmf;
    }
    // 正確なポアソン両側p値
    // P(X=i) <= P(X=k) となる全iの確率の合計
    let logLambda2 = lambda > 0 ? Math.log(lambda) : 0;
    // まずP(X=k)を計算
    let logFactK = 0;
    for (let i = 1; i <= totalCount; i++) logFactK += Math.log(i);
    const pmfKval = lambda > 0 ? Math.exp(-lambda + totalCount * logLambda2 - logFactK) : (totalCount === 0 ? 1 : 0);
    // P(X=i) <= pmfKval となる全iの確率を合計（十分大きいiまで）
    let pval = 0;
    let logFact = 0;
    const maxI = Math.max(totalCount * 3 + 30, 100);
    for (let i = 0; i <= maxI; i++) {
      if (i > 0) logFact += Math.log(i);
      const pmfI = lambda > 0 ? Math.exp(-lambda + i * logLambda2 - logFact) : (i === 0 ? 1 : 0);
      if (pmfI <= pmfKval + 1e-10) pval += pmfI;
    }
    pval = Math.min(pval, 1) * 100;
    stddevStr = Math.sqrt(lambda).toFixed(2) + ' (Po)';
    zStr = lambda > 0 ? ((totalCount - lambda) / Math.sqrt(lambda)).toFixed(2) + ' (Po)' : '—';
    probStr = pval.toFixed(pval < 0.1 ? 3 : 1) + '%';
    distLabel = currentLang.historyZscore ?? 'Z値:';
  }

  document.getElementById('historyPanelTotal').textContent = `TOTAL: ${total.toLocaleString()}`;

  sub.innerHTML = `
    <span>${currentLang.historyAvgRecent ?? '直近平均:'} ${avgRecent}</span>
    <span>${currentLang.historyAvgTotal ?? '総平均:'} ${avgTotal}</span>
    <span>${currentLang.historyTotalCount ?? '総出現:'} ${totalCount}</span>
    <span>${currentLang.historyExpected ?? '期待回数:'} ${expected}</span>
    <span>${currentLang.historyStddev ?? '標準偏差:'} ${stddevStr}</span>
    <span>${distLabel} ${zStr}</span>
    <span>${currentLang.historyProbWithin ?? '|Z|以上:'} ${probStr}</span>
  `;

  panel.classList.add('open');
}
